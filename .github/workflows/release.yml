name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Resolve tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          swift build -c release
          make test

      - name: Package
        # Stamp the tag into the bundle so the app cannot report a different version
        # from the release it was published under.
        run: make dist VERSION="${TAG#v}"
        env:
          TAG: ${{ steps.tag.outputs.name }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHECKSUM=$(shasum -a 256 build/AudioAdjuster-macos.zip | cut -d' ' -f1)
          cat > notes.md <<NOTES
          ## Install

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
          \`\`\`

          Or download \`AudioAdjuster-macos.zip\` below and move the app to /Applications.

          Requires macOS 14.2 or later. On first use the app asks for audio-recording
          permission — Core Audio process taps are gated behind it, and without it a tap
          returns silence rather than an error.

          The build is ad-hoc signed, not notarized, because the project has no Apple
          Developer ID. macOS will warn on first launch; see the README for what that
          means and how to proceed.

          \`\`\`
          SHA-256  ${CHECKSUM}
          \`\`\`
          NOTES
          gh release create "${{ steps.tag.outputs.name }}" \
            build/AudioAdjuster-macos.zip \
            --title "Audio Adjuster ${{ steps.tag.outputs.name }}" \
            --notes-file notes.md
