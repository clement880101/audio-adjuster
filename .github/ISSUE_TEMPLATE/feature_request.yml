name: Feature request
description: Suggest something the app should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Two things are out of reach and will be closed as such, so they are worth knowing
        up front:

        - **Per-browser-tab volume.** Browsers mix every tab's audio inside a single
          process before Core Audio sees it. Only a browser extension can separate them.
        - **Making already-loud audio louder.** Audio near full scale has no headroom;
          gain past that only drives the limiter.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation, rather than the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you think should happen
